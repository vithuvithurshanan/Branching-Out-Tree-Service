<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Branching Out Tree Service | Tree Removal, Trimming &amp; Stump Grinding — Hilton, NY</title>
    <meta
      name="description"
      content="Branching Out Tree Service provides tree removal, trimming, stump grinding and 24/7 storm damage response in Hilton, NY and the greater Rochester area. Call 585-667-8733 for a free estimate."
    />
    <link rel="icon" type="image/webp" href="/images/logo-96.webp" />
    <meta name="theme-color" content="#f3f0e7" />
    <!-- Preload LCP hero image so the browser fetches it immediately -->
    <link rel="preload" as="image" href="/images/hero-canopy.webp" fetchpriority="high" type="image/webp" />

    <!-- Preconnect to font origins (max 2 to avoid Lighthouse "too many preconnects") -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preconnect to GHL form origin to save ~310ms on iframe load. No crossorigin since iframes don't use CORS -->
    <link rel="preconnect" href="https://link.kdlead.com" />

    <!-- Non-blocking Google Fonts load — print→all prevents render-blocking -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Jost:wght@200;300;400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <!-- Fallback for no-JS -->
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Jost:wght@200;300;400;500;600&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
